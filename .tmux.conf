# ─────────────────────────────────────────────────────────────────────────────
# ~/.tmux.conf — Unified Minimalist (macOS + Linux)
# ─────────────────────────────────────────────────────────────────────────────

# ── PREFIX ───────────────────────────────────────────────────────────────────
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# ── GENERAL ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10          # faster key sequences (important for nvim)
set -g focus-events on         # Required for nvim autoread
setw -g mouse on
set -g history-limit 50000

# ── TERMINAL / 24-BIT COLOUR ─────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -sa terminal-features ",xterm-256color:RGB"
set -sa terminal-features ",alacritty:RGB"

# ── NATIVE VIM-AWARE NAVIGATION ──────────────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ── WINDOW / PANE MANAGEMENT ─────────────────────────────────────────────────
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind -n C-z resize-pane -Z

# ── COPY MODE & CLIPBOARD ────────────────────────────────────────────────────
setw -g mode-keys vi

# Cross-platform copy (macOS, Linux X11, Wayland)
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel " \
    if [ \"$(uname)\" = 'Darwin' ]; then pbcopy; \
    elif [ -n \"$WAYLAND_DISPLAY\" ]; then wl-copy; \
    else xclip -in -selection clipboard; fi"

# ── PROMPT NAVIGATION (M-b, M-n) ─────────────────────────────────────────────
bind -n M-b copy-mode \; send -X search-backward '[\$\#] '
bind -n M-n copy-mode \; send -X search-forward '[\$\#] '

# ── DESIGN (Tokyo Night Moon Palette) ────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1e2030,fg=#c8d3f5"
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#82aaff"

set -g status-left "#[fg=#82aaff,bold] #S "
set -g status-right "#[fg=#636da6]%H:%M "

setw -g window-status-format " #[fg=#636da6]#I:#W "
setw -g window-status-current-format " #[fg=#82aaff,bold]#I:#W* "

# ─────────────────────────────────────────────────────────────────────────────
# ~/.tmux.conf — Unified Minimalist (macOS + Linux)
# ─────────────────────────────────────────────────────────────────────────────

# ── PREFIX ───────────────────────────────────────────────────────────────────
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# ── GENERAL ──────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10          # faster key sequences (important for nvim)
set -g focus-events on         # Required for nvim autoread
setw -g mouse on
set -g history-limit 50000

# ── TERMINAL / 24-BIT COLOUR ─────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -sa terminal-features ",xterm-256color:RGB"
set -sa terminal-features ",alacritty:RGB"

# ── NATIVE VIM-AWARE NAVIGATION ──────────────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ── WINDOW / PANE MANAGEMENT ─────────────────────────────────────────────────
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind -n C-z resize-pane -Z

# ── COPY MODE & CLIPBOARD ────────────────────────────────────────────────────
setw -g mode-keys vi

# OSC-52: let tmux write directly to the terminal's clipboard.
# Works in most modern terminals (Alacritty, WezTerm, iTerm2, Ghostty …)
# and transparently over SSH — no xclip/pbcopy required.
set -s set-clipboard on

# v — begin selection (vim-style)
bind -T copy-mode-vi v send -X begin-selection

# y — yank: copy, keep cursor position, but clear the highlight
bind -T copy-mode-vi y \
    send -X copy-pipe \
    'if command -v pbcopy     >/dev/null 2>&1; then pbcopy; \
     elif command -v wl-copy  >/dev/null 2>&1; then wl-copy; \
     elif command -v xclip    >/dev/null 2>&1; then xclip -in -selection clipboard; \
     elif command -v xsel     >/dev/null 2>&1; then xsel --clipboard --input; fi' \;\
    send -X clear-selection

# Mouse drag — same pipe, keep position
bind -T copy-mode-vi MouseDragEnd1Pane \
    send -X copy-pipe-no-clear \
    'if command -v pbcopy     >/dev/null 2>&1; then pbcopy; \
     elif command -v wl-copy  >/dev/null 2>&1; then wl-copy; \
     elif command -v xclip    >/dev/null 2>&1; then xclip -in -selection clipboard; \
     elif command -v xsel     >/dev/null 2>&1; then xsel --clipboard --input; fi'

# ── PROMPT NAVIGATION (M-b, M-n) ─────────────────────────────────────────────
bind -n M-b copy-mode \; send -X search-backward '[\$\#] '
bind -n M-n copy-mode \; send -X search-forward '[\$\#] '

# ── DESIGN (Tokyo Night Moon Palette) ────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1e2030,fg=#c8d3f5"
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#82aaff"

set -g status-left "#[fg=#82aaff,bold] #S "
set -g status-right "#[fg=#636da6]%H:%M "

setw -g window-status-format " #[fg=#636da6]#I:#W "
setw -g window-status-current-format " #[fg=#82aaff,bold]#I:#W* "
